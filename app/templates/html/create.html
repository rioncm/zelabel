<!DOCTYPE html>
<html data-bs-theme="dark" lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:300italic,400italic,600italic,700italic,800italic,400,300,600,700,800&amp;display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/bs-theme-overrides.css') }}">
    <style>
        body {
            background-color: #2d2c38;
            color: #fff;
        }
        .form-control, .form-select {
            background-color: #373743;
            border-color: #444;
            color: #fff;
        }
        .form-control:focus, .form-select:focus {
            background-color: #373743;
            border-color: #666;
            color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(255,255,255,0.1);
        }
        .form-control::placeholder {
            color: #999;
        }
        .form-label {
            color: #fff;
        }
        .card {
            background-color: #373743;
            border-color: #444;
        }
        .navbar {
            background-color: #2d2c38 !important;
        }
        .btn-primary {
            background-color: #375a7f;
            border-color: #375a7f;
        }
        .btn-primary:hover {
            background-color: #2b4764;
            border-color: #2b4764;
        }
        .btn-secondary {
            background-color: #444;
            border-color: #444;
        }
        .btn-secondary:hover {
            background-color: #373737;
            border-color: #373737;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-md sticky-top py-3 navbar-dark" id="mainNav">
        <div class="container"><a class="navbar-brand d-flex align-items-center" href="/"><span class="bs-icon-sm bs-icon-circle bs-icon-primary shadow d-flex justify-content-center align-items-center me-2 bs-icon"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 16 16" class="bi bi-bezier">
                        <path fill-rule="evenodd" d="M0 10.5A1.5 1.5 0 0 1 1.5 9h1A1.5 1.5 0 0 1 4 10.5v1A1.5 1.5 0 0 1 2.5 13h-1A1.5 1.5 0 0 1 0 11.5zm1.5-.5a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5zm10.5.5A1.5 1.5 0 0 1 13.5 9h1a1.5 1.5 0 0 1 1.5 1.5v1a1.5 1.5 0 0 1-1.5 1.5h-1a1.5 1.5 0 0 1-1.5-1.5zm1.5-.5a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5zM6 4.5A1.5 1.5 0 0 1 7.5 3h1A1.5 1.5 0 0 1 10 4.5v1A1.5 1.5 0 0 1 8.5 7h-1A1.5 1.5 0 0 1 6 5.5zM7.5 4a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5z"></path>
                        <path d="M6 4.5H1.866a1 1 0 1 0 0 1h2.668A6.517 6.517 0 0 0 1.814 9H2.5c.123 0 .244.015.358.043a5.517 5.517 0 0 1 3.185-3.185A1.503 1.503 0 0 1 6 5.5zm3.957 1.358A1.5 1.5 0 0 0 10 5.5v-1h4.134a1 1 0 1 1 0 1h-2.668a6.517 6.517 0 0 1 2.72 3.5H13.5c-.123 0-.243.015-.358.043a5.517 5.517 0 0 0-3.185-3.185z"></path>
                    </svg></span><span>ZeLabel</span></a><button data-bs-toggle="collapse" class="navbar-toggler" data-bs-target="#navcol-1"><span class="visually-hidden">Toggle navigation</span><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navcol-1">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link" href="/create.html">Home</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <section class="py-5">
        <div class="container py-5">
            <div class="row mb-5">
                <div class="col-md-8 col-xl-6 text-center mx-auto">
                    <h2 class="fw-bold text-light">Print a New Label</h2>
                </div>
            </div>
            <div class="row d-flex justify-content-center">
                <div class="col-md-6 col-xl-4">
                    <div>
                        <form class="p-3 p-xl-4" id="printForm">
                            <div class="mb-3">
                                <label class="form-label">Label Template</label>
                                <select class="form-select" id="templateSelect">
                                    <option value="">Select a template...</option>
                                </select>
                            </div>
                            <div id="dynamicFields">
                                <!-- Fields will be dynamically inserted here -->
                            </div>
                            <div>
                                <button class="btn btn-primary shadow d-block w-100 mb-2" type="submit">Print One Copy</button>
                                <button class="btn btn-secondary shadow d-block w-100" type="button" id="clearBtn">Clear</button>
                            </div>
                        </form>
                        <script>
                        let templates = {};
                        
                        async function loadTemplates() {
                            const response = await fetch('/api/v1/templates');
                            templates = await response.json();
                            
                            const select = document.getElementById('templateSelect');
                            Object.entries(templates.templates).forEach(([key, template]) => {
                                const option = document.createElement('option');
                                option.value = key;
                                option.textContent = template.name;
                                select.appendChild(option);
                            });
                        }

                        function renderTemplateFields(templateId) {
                            const template = templates.templates[templateId];
                            const container = document.getElementById('dynamicFields');
                            container.innerHTML = '';

                            if (!template) return;

                            template.fields.forEach(field => {
                                const div = document.createElement('div');
                                div.className = 'mb-3';

                                if (field.type === 'textarea') {
                                    div.innerHTML = `
                                        <label class="form-label">${field.label}</label>
                                        <textarea class="form-control" 
                                                 id="${field.id}" 
                                                 name="${field.id}"
                                                 placeholder="${field.placeholder}"
                                                 rows="${field.rows || 4}"></textarea>
                                    `;
                                } else {
                                    div.innerHTML = `
                                        <label class="form-label">${field.label}</label>
                                        <input class="form-control" 
                                               type="${field.type}"
                                               id="${field.id}"
                                               name="${field.id}"
                                               placeholder="${field.placeholder}">
                                    `;
                                }
                                container.appendChild(div);
                            });
                        }

                        document.getElementById('templateSelect').addEventListener('change', (e) => {
                            renderTemplateFields(e.target.value);
                        });

                        document.getElementById('printForm').addEventListener('submit', async function(e) {
                            e.preventDefault();
                            const templateId = document.getElementById('templateSelect').value;
                            if (!templateId) {
                                alert('Please select a template');
                                return;
                            }

                            const template = templates.templates[templateId];
                            const formData = {
                                format: templateId,
                                copies: 1,
                                label: {}
                            };

                            // Add each field to the label object
                            template.fields.forEach(field => {
                                formData.label[field.id] = document.getElementById(field.id).value || "";
                            });
                            
                            console.log('Sending data:', formData);

                            try {
                                const response = await fetch('/api/v1/print', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify(formData)
                                });

                                if (!response.ok) {
                                    throw new Error('Failed to print label');
                                }

                                alert('Label sent to printer');
                            } catch (error) {
                                alert('Error: ' + error.message);
                            }
                        });

                        document.getElementById('clearBtn').addEventListener('click', function() {
                            document.getElementById('printForm').reset();
                            document.getElementById('dynamicFields').innerHTML = '';
                        });

                        // Load templates when page loads
                        loadTemplates();
                        </script>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='assets/js/bold-and-dark.js') }}"></script>
</body>
</html>
